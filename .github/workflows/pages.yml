name: Deploy TraceMat demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble public files
        run: |
          mkdir -p site/data/graphs site/docs site/audit site/results
          cp index.html site/index.html
          cp -R viewer site/viewer
          cp data/graphs/Maradona_graph.json site/data/graphs/
          cp docs/query_schema.md site/docs/
          cp audit/LABELLING_PROTOCOL.md site/audit/
          cp results/grounding_audit_metrics.json site/results/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
